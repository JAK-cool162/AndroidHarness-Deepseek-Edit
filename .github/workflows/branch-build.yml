# Builds claude/** branches: unit tests, then a debug APK uploaded as an artifact.
name: Branch build

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      # Same toolchain the nightly build installs: the runner image does not
      # carry the pinned NDK, and AGP refuses to configure without it.
      - name: Install pinned NDK
        run: "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;27.2.12479018'"

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to the branch's prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/*.apk "AndroidHarness-DeepSeek-cache-debug.apk"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" AndroidHarness-DeepSeek-cache-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Debug APK: $GITHUB_REF_NAME" --notes "Debug build of $GITHUB_SHA from $GITHUB_REF_NAME."
