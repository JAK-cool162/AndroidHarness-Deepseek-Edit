# Builds claude/** branches: unit tests, then an arm64 release APK published as a prerelease.
name: Branch build

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      # Same toolchain the nightly build installs: the runner image does not
      # carry the pinned NDK, and AGP refuses to configure without it.
      - name: Install pinned NDK
        run: "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;27.2.12479018'"

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pr-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build release APK (arm64, shrunk)
        run: ./gradlew :app:assembleRelease -Pabis=arm64-v8a -PappIdSuffix=.deepseek --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to the branch's prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/*.apk "AndroidHarness-DeepSeek-cache.apk"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" AndroidHarness-DeepSeek-cache.apk --prerelease --target "$GITHUB_SHA" \
            --title "APK: $GITHUB_REF_NAME" --notes "arm64 release build of $GITHUB_SHA from $GITHUB_REF_NAME."

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the branch APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "build-${GITHUB_REF_NAME//\//-}" --pattern AndroidHarness-DeepSeek-cache.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Google APIs x86_64 images from API 30 translate arm64 code, so the arm64 APK runs.
      - name: Capture screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash .github/scripts/screenshots.sh

      - name: Attach screenshots to the branch prerelease
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls screenshots || exit 0
          gh release upload "build-${GITHUB_REF_NAME//\//-}" screenshots/* --clobber
